name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: bridge test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: 语法检查
        run: python -m py_compile ocr_adapter.py chunk_big.py chunk_js.py chunk_ts.py chunk_vue.py js_symbols.py

      - name: 安装 JS/TS 解析依赖
        run: python -m pip install --quiet tree_sitter tree_sitter_javascript tree_sitter_typescript

      - name: 自检
        run: python tests/test_bridge.py

      - name: JS 分段器自测
        run: python tests/selftest_js.py chunk_js.py

      # 几何真值：不是"分段器自己说自己对"，而是拿源文件逐字比对 body_start 指向的行。
      # 强制 --max-lines 20 是为了真正走到"类/方法被切开"那条路径——默认 240 行时
      # 小样本只会出 1 块，等于没验到切分。
      - name: 分段几何真值（夹具）
        run: |
          python qa/regress_chunker.py --cmd "python chunk_big.py" --target tests/fixtures/python --ext .py  --max-lines 20
          python qa/regress_chunker.py --cmd "python chunk_js.py"  --target tests/fixtures/js     --ext .js  --max-lines 20
          python qa/regress_chunker.py --cmd "python chunk_ts.py"  --target tests/fixtures/ts     --ext .ts  --max-lines 20
          python qa/regress_chunker.py --cmd "python chunk_ts.py"  --target tests/fixtures/ts     --ext .tsx --max-lines 20
          python qa/regress_chunker.py --cmd "python chunk_vue.py" --target tests/fixtures/vue    --ext .vue --max-lines 20

      - name: 分段器在真实大文件上无报错（3.12 只跑一次）
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python - <<'PY'
          # 造一个 1500 行的大文件，确认不崩
          src = ["from __future__ import annotations", ""]
          for i in range(120):
              src.append(f"def f{i}(a, b):")
              src.append(f"    return a + b + {i}")
              src.append("")
          open("big_generated.py", "w").write("\n".join(src))
          PY
          python chunk_big.py big_generated.py --out .ci_chunks --no-git
